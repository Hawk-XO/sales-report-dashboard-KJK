<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5 text-center">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/start" class="btn btn-outline-primary">🏠 Home</a>
        <h4 class="text-center flex-grow-1">Your Page Title</h4>
        <span class="text-muted" id="today_date"></span>
    </div>

    <script>
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        document.getElementById("today_date").innerText = "Today: " + dd + "/" + mm + "/" + yyyy;
    </script>

    <h2 class="mb-4">Admin Login</h2>

    {% if error %}  
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin">
        <div class="mb-3">
            <input type="password" class="form-control" name="password" placeholder="Enter Admin Password" required>
        </div>
        <button type="submit" class="btn btn-dark">Login</button>
    </form>

</body>
</html>
