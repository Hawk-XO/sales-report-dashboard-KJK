<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Export Sales Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .autocomplete-suggestions {
            border: 1px solid #ccc;
            max-height: 150px;
            overflow-y: auto;
            position: absolute;
            background-color: #fff;
            z-index: 9999;
            width: 100%;
        }

        .autocomplete-suggestion {
            padding: 8px;
            cursor: pointer;
        }

        .autocomplete-suggestion:hover {
            background-color: #e9ecef;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar a {
            text-decoration: none;
        }

        .notification-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(40, 167, 69, 0.9); /* Light green, Bootstrap's success color with opacity */
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            z-index: 99999;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .notification-banner.show {
            opacity: 1;
        }
    </style>
</head>
<body class="container py-4">
    <div class="top-bar mb-3">
        <a href="/start" class="btn btn-outline-primary btn-sm">🏠 Home</a>
        <span class="text-muted">Today's Date: <span id="today_date"></span></span>
    </div>

    <h2 class="mb-4">Export Sales Report Entry</h2>

    <form method="POST" action="/submit_export" id="exportForm">
        <div class="mb-3">
            <label for="invoice_no" class="form-label">Invoice No</label>
            <input type="text" class="form-control" id="invoice_no" name="invoice_no" required>
        </div>

        <div class="mb-3">
            <label for="invoice_date" class="form-label">Invoice Date</label>
            <input type="date" class="form-control" id="invoice_date" name="invoice_date" required>
        </div>

        <div class="mb-3 position-relative">
            <label for="party_name" class="form-label">Party Name</label>
            <input type="text" class="form-control" id="party_name" name="party_name" autocomplete="off" required>
            <div id="party_suggestions" class="autocomplete-suggestions"></div>
        </div>

        <div class="mb-3">
            <label for="region_name" class="form-label">Country</label>
            <select class="form-select" id="region_name" name="region_name" required>
                {% for country in countries %}
                <option value="{{ country }}">{{ country }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="product_value" class="form-label">Product Value</label>
            <input type="number" step="0.01" class="form-control" id="product_value" name="product_value" required>
        </div>

        <div class="mb-3">
            <label for="exchange_rate" class="form-label">Exchange Rate</label>
            <input type="number" step="0.01" class="form-control" id="exchange_rate" name="exchange_rate" required>
        </div>

        <div class="mb-3">
            <label for="currency_name" class="form-label">Currency Name</label>
            <select class="form-select" id="currency_name" name="currency_name" required>
                {% for currency in currencies %}
                <option value="{{ currency }}">{{ currency }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="invoice_type" class="form-label">Export Type</label>
            <select class="form-select" id="invoice_type" name="invoice_type" required>
                <option value="export_xlnt">Export XLNT</option>
                <option value="international">International</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Submit Export</button>
    </form>

    <!-- Top center success banner -->
    <div id="successBanner" class="notification-banner">✅ Data entered successfully</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Format today's date
        function formatDateDMY(date) {
            const d = new Date(date);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        const today = new Date();
        document.getElementById("invoice_date").value = today.toISOString().split('T')[0];
        document.getElementById("today_date").innerText = formatDateDMY(today);

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById("exportForm");
            const banner = document.getElementById("successBanner");

            // Autocomplete logic
            const partyInput = document.getElementById("party_name");
            const suggestionsBox = document.getElementById("party_suggestions");

            partyInput.addEventListener("input", async () => {
                const query = partyInput.value;
                if (query.length < 1) {
                    suggestionsBox.innerHTML = "";
                    return;
                }

                const res = await fetch(`/autocomplete_party?query=${encodeURIComponent(query)}`);
                const suggestions = await res.json();

                suggestionsBox.innerHTML = "";
                suggestions.forEach(name => {
                    const div = document.createElement("div");
                    div.textContent = name;
                    div.className = "autocomplete-suggestion";
                    div.onclick = () => {
                        partyInput.value = name;
                        suggestionsBox.innerHTML = "";
                    };
                    suggestionsBox.appendChild(div);
                });
            });

            document.addEventListener("click", (e) => {
                if (!suggestionsBox.contains(e.target)) {
                    suggestionsBox.innerHTML = "";
                }
            });

            // Show notification banner
            function showSuccessBanner() {
                banner.classList.add('show');
                setTimeout(() => {
                    banner.classList.remove('show');
                }, 5000); // 5 seconds
            }

            // Form submission
            form.addEventListener("submit", function(event) {
                event.preventDefault();
                fetch(form.action, {
                    method: "POST",
                    body: new FormData(form)
                }).then(response => {
                    if (response.ok) {
                        form.reset();
                        document.getElementById("invoice_date").value = today.toISOString().split('T')[0];
                        showSuccessBanner();
                    } else {
                        alert("Failed to submit data");
                    }
                }).catch(() => {
                    alert("Error occurred while submitting");
                });
            });
        });
    </script>
</body>
</html>
