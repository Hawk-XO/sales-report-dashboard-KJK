<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Entry Options</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5 text-center">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/start" class="btn btn-outline-primary">🏠 Home</a>
        <span class="text-muted" id="today_date"></span>
    </div>

    <script>
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0'); // January is 0!
        const yyyy = today.getFullYear();
        document.getElementById("today_date").innerText = "Today: " + dd + "/" + mm + "/" + yyyy;
    </script>

    <h2 class="mb-5">Choose Entry Type</h2>

    <div class="d-grid gap-3 col-6 mx-auto">
        <a href="/domestic" class="btn btn-outline-primary btn-lg">Domestic Entry</a>
        <a href="/export" class="btn btn-outline-success btn-lg">Export Entry</a>
        <a href="/sales_report" class="btn btn-outline-secondary btn-lg">📊 View Report</a>
    </div>
</body>
</html>
